# Baut bei einem Tag-Push (v1.2.3) das Programm für Windows x64 und legt ein Release
# mit ZIP-Anhängen an. Das WPF-Projekt wird unter Linux mit EnableWindowsTargeting gebaut.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: .NET 10 SDK bereitstellen
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version aus dem Tag ableiten
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Tag $TAG, Version $VERSION"

      - name: Bauen (framework-abhängig, braucht .NET 10 Desktop Runtime)
        run: |
          set -eu
          dotnet publish HddDefrag.csproj -c Release -r win-x64 --self-contained false \
            -p:EnableWindowsTargeting=true -p:Version="$VERSION" -p:PublishSingleFile=true -p:IncludeSourceRevisionInInformationalVersion=false \
            -o publish/fdd

      - name: Bauen (eigenständig, ohne installiertes .NET)
        run: |
          set -eu
          dotnet publish HddDefrag.csproj -c Release -r win-x64 --self-contained true \
            -p:EnableWindowsTargeting=true -p:Version="$VERSION" -p:PublishSingleFile=true -p:IncludeSourceRevisionInInformationalVersion=false \
            -o publish/sc

      - name: ZIP-Pakete schnüren
        run: |
          set -eu
          mkdir -p dist
          cp README.md LICENSE publish/fdd/
          cp README.md LICENSE publish/sc/
          (cd publish/fdd && zip -qr "../../dist/HddDefrag-$TAG-win-x64.zip" .)
          (cd publish/sc && zip -qr "../../dist/HddDefrag-$TAG-win-x64-eigenstaendig.zip" .)
          (cd dist && sha256sum *.zip > "SHA256SUMS-$TAG.txt")
          ls -la dist

      - name: Release anlegen und Dateien anhängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          NOTES=$(printf 'HddDefrag %s\n\n- `HddDefrag-%s-win-x64.zip`: benötigt die .NET 10 Desktop Runtime (x64).\n- `HddDefrag-%s-win-x64-eigenstaendig.zip`: bringt .NET mit, keine Installation nötig.\n\nBeide Varianten fordern beim Start Administratorrechte per UAC an. Nur Festplatten (HDD) werden defragmentiert, SSDs sind gesperrt. Details in der README.' "$TAG" "$TAG" "$TAG")
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "HddDefrag $TAG" --notes "$NOTES"
          fi
